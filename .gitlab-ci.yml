stages:
  - build
  - deploy

build:
  stage: build
  tags:
    - sandbox
  script:
    - cd app
    - npm install --legacy-peer-deps
    - npm run build
  artifacts:
    paths:
      - app/dist

pages:
  stage: deploy
  tags:
    - sandbox
  script:
    - node -e "const fs=require('fs');fs.mkdirSync('public',{recursive:true});const p=require('path');function copyDir(s,d){fs.mkdirSync(d,{recursive:true});for(const f of fs.readdirSync(s)){const sp=p.join(s,f),dp=p.join(d,f);fs.statSync(sp).isDirectory()?copyDir(sp,dp):fs.copyFileSync(sp,dp)}}copyDir('app/dist','public');fs.copyFileSync('public/index.html','public/404.html')"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
