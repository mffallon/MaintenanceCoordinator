image: node:22-alpine

stages:
  - build
  - deploy

build:
  stage: build
  tags:
    - sandbox
  script:
    - cd app
    - npm install --legacy-peer-deps
    - npm run build
  artifacts:
    paths:
      - app/dist

pages:
  stage: deploy
  tags:
    - sandbox
  needs:
    - job: build
      artifacts: true
  script:
    - mkdir -p public
    - cp -r app/dist/* public/
    - cp public/index.html public/404.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
